name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool
      - name: Static analysis
        run: dart analyze lib test integration_test tool
      - name: Unit and widget tests
        run: flutter test
      - name: Build web demo
        run: flutter build web --release --no-web-resources-cdn --no-wasm-dry-run --dart-define=TASKO_STUDENTS_DEMO=true
