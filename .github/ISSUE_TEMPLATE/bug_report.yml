name: Ошибка
description: Сообщить о воспроизводимой проблеме
body:
  - type: input
    id: environment
    attributes:
      label: Версия и устройство
      placeholder: Версия Tasko, ОС, модель устройства или браузер
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: true
